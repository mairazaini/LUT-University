<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>TV Show Search</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #eceff1;
        }

        .show-container {
            padding-left: 10px;
            padding-right: 10px;
        }

        .show-data {
            width: 100%;
            background-color: #cfd8dc;
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .show-data h1 {
            text-align: center;
        }

        .show-data img {
            display: block;
        }

        .show-info {
            width: 100%;
        }

        @media (min-width: 800px) {
            .show-data {
                display: flex;
            }

            .show-info {
                padding: 10px;
            }
        }

        @media (max-width: 800px) {
            .show-data img {
                margin: auto;
            }

            .show-info p {
                text-align: center;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">TV Show Viewer</a>
            <form id="search-form" class="d-flex">
                <input id="input-show" class="form-control me-2" type="search" placeholder="Search for a show" aria-label="Search">
                <button id="submit-data" class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </nav>

    <div class="show-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('search-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const showContainer = document.querySelector('.show-container');
            showContainer.innerHTML = ''; 
            const query = document.getElementById('input-show').value;

            const response = await fetch(`https://api.tvmaze.com/search/shows?q=${query}`);
            const shows = await response.json();

            shows.forEach(showObj => {
                const show = showObj.show;
                const showElement = document.createElement('div');
                showElement.classList.add('show-data');

                showElement.innerHTML = `
                    <img src="${show.image ? show.image.medium : 'https://via.placeholder.com/210x295'}" alt="${show.name}">
                    <div class="show-info">
                        <h1>${show.name}</h1>
                        ${show.summary || '<p>No summary available</p>'}
                    </div>
                `;
                showContainer.appendChild(showElement);
            });
        });
    </script>
</body>
</html>
